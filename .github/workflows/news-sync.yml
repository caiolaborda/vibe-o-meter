name: Autonomous News Ingestion & Sentiment Audit

on:
  schedule:
    # Relay Slot A (:13 and :43) — each wake-up runs a 6-pulse relay chain (T=0m..+150m) to bridge GitHub cron throttling gaps
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/news-sync.yml'
      - '.github/workflows/sync-pulse.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'news-relay-slot-a'
  cancel-in-progress: true

jobs:
  pulse-1:
    name: Sync Pulse 1 (T+0m)
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-1
    secrets: inherit

  wait-1:
    name: Interval Wait (30m)
    needs: pulse-1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 22m before next Pulse (~30m wall-clock cycle including sync + runner queue)
        run: sleep 1320

  pulse-2:
    name: Sync Pulse 2 (T+30m)
    needs: wait-1
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-2
    secrets: inherit

  wait-2:
    name: Interval Wait (60m)
    needs: pulse-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 22m before next Pulse (~30m wall-clock cycle including sync + runner queue)
        run: sleep 1320

  pulse-3:
    name: Sync Pulse 3 (T+60m)
    needs: wait-2
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-3
    secrets: inherit

  wait-3:
    name: Interval Wait (90m)
    needs: pulse-3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 22m before next Pulse (~30m wall-clock cycle including sync + runner queue)
        run: sleep 1320

  pulse-4:
    name: Sync Pulse 4 (T+90m)
    needs: wait-3
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-4
    secrets: inherit

  wait-4:
    name: Interval Wait (120m)
    needs: pulse-4
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 22m before next Pulse (~30m wall-clock cycle including sync + runner queue)
        run: sleep 1320

  pulse-5:
    name: Sync Pulse 5 (T+120m)
    needs: wait-4
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-5
    secrets: inherit

  wait-5:
    name: Interval Wait (150m)
    needs: pulse-5
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 22m before next Pulse (~30m wall-clock cycle including sync + runner queue)
        run: sleep 1320

  pulse-6:
    name: Sync Pulse 6 (T+150m)
    needs: wait-5
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-6
    secrets: inherit
