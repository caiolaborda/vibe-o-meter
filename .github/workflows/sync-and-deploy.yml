name: Automated News Sync & Deploy

on:
  schedule:
    # Runs every 4 hours automatically (100% free within GitHub Actions 2,000 min/mo tier)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/**'
      - '!public/data/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'news-sync'
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch RSS & Analyze Vibes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Headless Sync Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.1-8b-instant' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEFAULT_ANALYZER: ${{ secrets.DEFAULT_ANALYZER || 'gemini' }}
        run: node scripts/sync.js

      - name: Commit updated vibe datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vibe-data.json public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update vibe sentiment data [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
