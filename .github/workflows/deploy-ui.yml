name: Fast UI Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'public/index.html'
      - 'public/style.css'
      - 'public/app.js'
      - 'public/img/**'
      - 'public/data/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Upload Static Website Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (always latest main HEAD so queued runs never overwrite newer sync data)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public/'

  deploy:
    name: Deploy UI to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
