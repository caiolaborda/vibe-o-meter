name: Longitudinal Cross-Archive Realignment (6h Flex / Batch)

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      use_batch_api:
        description: 'Submit/poll via Gemini Batch API (--batch) instead of Flex tier'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  realign:
    name: Realign Multi-Day Evolutions & Lateral Graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Cross-Archive Realignment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
        run: |
          if [ "${{ inputs.use_batch_api }}" = "true" ]; then
            node scripts/realign-archive.js --batch
          else
            node scripts/realign-archive.js
          fi

      - name: Commit updated archive & feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vibe-data.json data/clusters-archive.json public/data/
          if git diff --staged --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "chore(archive): daily cross-archive evolution & lateral graph realignment"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main; then
                git push origin HEAD:main && break
              else
                git rebase --abort || true
                git fetch origin main
                git reset --soft origin/main
                git add data/vibe-data.json data/clusters-archive.json public/data/
                git commit -m "chore(archive): daily cross-archive evolution & lateral graph realignment" || true
                git push origin HEAD:main && break
              fi
              sleep 3
            done
          fi
