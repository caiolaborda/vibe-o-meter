name: Autonomous News Ingestion (Relay B)

on:
  schedule:
    # Relay Slot B (:28 and :58) — independent workflow_id slot + 6-pulse chain (T=0m..+150m)
    - cron: '28 * * * *'
    - cron: '58 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pulse-1:
    name: Sync Pulse 1 (T+0m)
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-1
    secrets: inherit

  wait-1:
    name: Interval Wait (30m)
    needs: pulse-1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 30 minutes before Pulse 2 (no concurrency lock held)
        run: sleep 1800

  pulse-2:
    name: Sync Pulse 2 (T+30m)
    needs: wait-1
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-2
    secrets: inherit

  wait-2:
    name: Interval Wait (60m)
    needs: pulse-2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 30 minutes before Pulse 3 (no concurrency lock held)
        run: sleep 1800

  pulse-3:
    name: Sync Pulse 3 (T+60m)
    needs: wait-2
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-3
    secrets: inherit

  wait-3:
    name: Interval Wait (90m)
    needs: pulse-3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 30 minutes before Pulse 4 (no concurrency lock held)
        run: sleep 1800

  pulse-4:
    name: Sync Pulse 4 (T+90m)
    needs: wait-3
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-4
    secrets: inherit

  wait-4:
    name: Interval Wait (120m)
    needs: pulse-4
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 30 minutes before Pulse 5 (no concurrency lock held)
        run: sleep 1800

  pulse-5:
    name: Sync Pulse 5 (T+120m)
    needs: wait-4
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-5
    secrets: inherit

  wait-5:
    name: Interval Wait (150m)
    needs: pulse-5
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait 30 minutes before Pulse 6 (no concurrency lock held)
        run: sleep 1800

  pulse-6:
    name: Sync Pulse 6 (T+150m)
    needs: wait-5
    if: always()
    uses: ./.github/workflows/sync-pulse.yml
    with:
      pulse_id: pulse-6
    secrets: inherit
